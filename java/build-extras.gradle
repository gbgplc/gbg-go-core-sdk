// This file
// * is referred to in an `apply from` command in `build.gradle`
// * can be used to customise `build.gradle`
// * is generated once and not overwritten in SDK generation updates

// Test support for the hand-written hooks in com.gbg.gocore.hooks.
//
// These live here rather than in build.gradle because build.gradle is
// regenerated by Speakeasy on every run and would lose them. Mirrors the
// TypeScript SDK's src/__tests__/x-gbg-source.test.mjs — see GGO-16030.
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Require a human to release to Maven Central.
//
// The sonatype-central-upload plugin defaults publishingType to AUTOMATIC, and
// publishing.gradle does not set it — so an upload would go straight to Maven
// Central, where every version is permanent and cannot be replaced or deleted.
// MANUAL uploads and validates, then leaves the deployment sitting in the
// Central Portal UI to be released or dropped.
//
// This also makes a real end-to-end credential test possible: upload, confirm
// it validates, then drop it without publishing anything.
//
// This override lives here because publishing.gradle IS tracked in
// .speakeasy/gen.lock and is overwritten on every regeneration. This file is
// generated once and never overwritten. Applied after publishing.gradle, so
// this afterEvaluate block runs last and wins.
//
// To go back to publishing on merge, delete this block.
afterEvaluate {
    if (tasks.findByName('sonatypeCentralUpload') != null) {
        tasks.named('sonatypeCentralUpload') {
            publishingType = 'MANUAL'
        }
    }
}
