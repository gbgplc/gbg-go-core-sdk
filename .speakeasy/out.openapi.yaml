  /as/token.oauth2:
    post:
      summary: "Generate access token"
      description: "Get an access token to authenticate API requests. If you're unfamiliar with the authentication process, check out the [authentication guide](/docs/go-v2/developer-integration/execute-customer-journeys/authenticate) for more details."
      security: []
      servers:
        - url: "https://api.auth.gbgplc.com"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ClientCredentialsGrantRequest"
                - $ref: "#/components/schemas/PasswordGrantRequest"
              discriminator:
                propertyName: "grant_type"
                mapping:
                  client_credentials: "#/components/schemas/ClientCredentialsGrantRequest"
                  password: "#/components/schemas/PasswordGrantRequest"
      responses:
        "200":
          description: "Successfully retrieved access token."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  access_token:
                    type: "string"
                    description: "The access token used for authentication."
                  expires_in:
                    type: "integer"
                    description: "Token expiration time in seconds."
                  token_type:
                    type: "string"
                    description: "The type of token, usually 'Bearer'."
        "400":
          description: "Invalid request. Check your credentials."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
        "401":
          description: "Unauthorized request. Invalid client or user credentials."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
      tags:
        - "Authentication"
      operationId: postAsTokenOauth2
      x-speakeasy-group: tokens
      x-speakeasy-name-override: generate
