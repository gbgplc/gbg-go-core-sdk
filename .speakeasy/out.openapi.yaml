  /journey/interaction/asset/upload:
    post:
      tags:
        - "Interaction"
      summary: "Stream an interaction asset to storage"
      description: "Streams a raw asset body (application/octet-stream) to storage and returns its gofs key. Identifiers are passed as X-Instance-Id, X-Interaction-Id and X-Domain-Element-Id headers. Accepts capture elements: the encrypted selfie (EncryptedSelfie/selfieImage), the plain selfie (Selfie/selfieImage), and both document sides (PrimaryDocument/side1Image, PrimaryDocument/side2Image). An element the current deployment does not accept returns 422 — submit that asset inline (base64) in the interaction submit instead."
      security:
        - CustomerAccess: []
        - InteractionAccess: []
      responses:
        "200":
          description: "Asset stored; returns the gofs key to reference in the subsequent submit"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  domainElementId:
                    type: "string"
                  gofsKey:
                    type: "string"
                required:
                  - "domainElementId"
                  - "gofsKey"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Instance not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Element is not being collected by the current interaction"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Asset too large or unsupported element"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "Too many requests for this journey instance, or the element has been uploaded the maximum number of times for this journey (retry after Retry-After)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Asset storage unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: uploadInteractionAsset
      x-speakeasy-group: interactions
      x-speakeasy-name-override: uploadAsset
  /journey/instance/{instanceId}/handoff-token:
    post:
      tags:
        - "Interaction"
      summary: "Mint a fresh position-scoped handoff token"
      description: "Mints a fresh page-mode delivery-token + connect-secret pair pointing at the same instance, stamped devicePosition=joined, so a second device can join. Device-token only, and only from the device that started the journey; customer tokens and already-joined devices are rejected with 403. Returns { instanceUrl, devicePosition, expiresIn }."
