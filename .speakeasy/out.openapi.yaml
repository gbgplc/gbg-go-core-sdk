  /journey/schema/fetch:
    post:
      tags:
        - "Journey"
      summary: "Fetch interaction JSON schemas"
      description: "Retrieves design-time JSON schemas for the interactions in a delivery — what information the journey\nexpects a user to complete, which fields are required, and what shape they take.\n\nIdentifiers are short on both sides; this endpoint never accepts or returns a GRN.\n`resourceId` is the same short identifier `POST /journey/start` takes (`my-delivery@latest`), and the\norganization is derived from your token. The response reports the short `deliveryId` plus\n`resolvedVersion`, the concrete revision it resolved — join them as `<deliveryId>@<resolvedVersion>` to\npin `/journey/start` to exactly the revision these schemas describe (`@latest` is an alias, not a\nsnapshot).\n\nTwo caveats on that pin. `/journey/start` serves from a cache, so it can briefly run a revision behind\nthe one described here. And the pin is only startable when the delivery lives in your token's primary\norganization: this endpoint also searches organizations granted by the token's `x_orgs` federation\nclaim, which `/journey/start` does not, so a delivery found only through federation is readable here\nbut not startable with the same token.\n\nKnown limitation on that federated search: a delivery that a parent organization *linked* into yours\nis not currently followed to its source and reports 404 here, even though `/journey/start` can run it.\n\nFilters by `interactionId` and/or `instruction` are optional; `instruction` requires `interactionId`.\n`interactionId` is the short interaction id (e.g. `segment1`) — a GRN, or a short id carrying an\n`@version` suffix, is rejected with 400.\n\nNote: the `interactionId` reported here is a design-time label for reading the journey. It is not the\nidentifier `POST /journey/interaction/submit` expects — that one comes from\n`POST /journey/interaction/fetch`, which uses the runtime's own identifiers."
      security:
        - CustomerAccess: []
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                resourceId:
                  type: "string"
                  minLength: 1
                  maxLength: 256
                  pattern: "^[a-zA-Z0-9_-]+(@[a-zA-Z0-9_.-]+)?$"
                interactionId:
                  type: "string"
                  minLength: 1
                  maxLength: 256
                  pattern: "^[A-Za-z0-9_\\-.~:@]+$"
                instruction:
                  type: "string"
                  minLength: 1
                  maxLength: 256
              required:
                - "resourceId"
              additionalProperties: false
      responses:
        "200":
          description: "Schemas fetched"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaFetchResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permissions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Delivery / interaction / flow not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Unprocessable — unknown refs, unknown interaction/instruction, or flow too complex"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Service unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getJourneySchemas
      x-speakeasy-group: journeys
      x-speakeasy-name-override: getSchemas
