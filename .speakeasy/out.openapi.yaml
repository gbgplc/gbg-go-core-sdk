openapi: "3.1.0"
info:
  title: "GBG GO Journey API"
  version: "2.x"
  description: "GBG GO API for orchestrating identity verification journeys."
  contact:
    name: "GBG GO Team"
  license:
    name: "Proprietary"
servers:
  - url: https://eu.platform.go.gbgplc.com/v2/captain
    description: EU
  - url: https://us.platform.go.gbgplc.com/v2/captain
    description: US
  - url: https://au.platform.go.gbgplc.com/v2/captain
    description: AU
tags:
  - name: "Authentication"
    description: "Obtain an access token to authenticate API requests (GBG auth server)"
  - name: "Journey"
    description: "Journey lifecycle management (Customer Token required)"
  - name: "Interaction"
    description: "User interaction management (End-User Token required)"
  - name: "Device"
    description: "Device authentication and token exchange"
  - name: "Test scenarios"
    description: "Test scenario management (Customer Token required)"
security: []
components:
  securitySchemes:
    CustomerAccess:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Customer JWT token for journey lifecycle operations. Required for: journey/start, journey/state/fetch, device/start"
    InteractionAccess:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "End-User JWT token for end-user scoped operations. Required for: interaction/fetch, interaction/submit, device/validate"
    DeviceConnect:
      type: "http"
      scheme: "bearer"
      description: "Single-use bearer credential for completing the device handshake. See the partner integration guide."
  schemas:
    DeviceConnectRequest:
      type: "object"
      properties:
        deviceInfo:
          type: "object"
          properties:
            deviceId:
              type: "string"
              minLength: 1
              maxLength: 64
            deviceName:
              type: "string"
              maxLength: 256
            deviceType:
              type: "string"
              maxLength: 128
          required:
            - "deviceId"
      description: "Optional. `deviceInfo` is deprecated; device metadata is now read from request headers."
    JourneyStartResponse:
      type: "object"
      properties:
        instanceId:
          type: "string"
        instanceUrl:
          type: "string"
        status:
          type: "string"
          enum:
            - "started"
            - "completed"
            - "failed"
            - "awaiting-input"
            - "pending"
        message:
          type: "string"
        state:
          $ref: "#/components/schemas/StateFetchResponse"
        test:
          type: "boolean"
          enum:
            - true
          description: "Present and `true` only when the journey was started as a test scenario."
        scenario:
          type: "string"
          description: "The test scenario that was applied: its name, or \"inline\" for a scenario supplied in the request body. Present only together with `test: true`."
          example: "inline"
      required:
        - "instanceId"
        - "status"
    StateFetchResponse:
      type: "object"
      properties:
        view:
          type: "string"
          enum:
            - "full"
        instanceId:
          type: "string"
        status:
          type: "string"
        context:
          type: "object"
          additionalProperties: {}
        result:
          type: "object"
          additionalProperties: {}
      required:
        - "view"
        - "instanceId"
        - "status"
    ErrorResponse:
      type: "object"
      properties:
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/GbgError"
          minItems: 1
      required:
        - "errors"
    GbgError:
      type: "object"
      properties:
        code:
          type: "string"
          pattern: "^\\d{4}$"
        name:
          type: "string"
          minLength: 1
        problem:
          type: "string"
          minLength: 1
        action:
          type: "string"
          minLength: 1
        location:
          type: "string"
          enum:
            - "Path"
            - "Authorization"
            - "Header"
            - "Query String"
            - "Request"
            - "Body"
            - "Service"
            - "Flow"
      required:
        - "code"
        - "name"
        - "problem"
        - "action"
    InteractionFetchResponse:
      type: "object"
      properties:
        view:
          type: "string"
          enum:
            - "full"
        instanceId:
          type: "string"
        interactionId:
          type: "string"
        journey:
          type: "object"
          properties:
            status:
              type: "string"
          required:
            - "status"
        interaction:
          type: "object"
          additionalProperties: {}
        context:
          type: "object"
          additionalProperties: {}
        instructions: {}
        outstanding: {}
        outstandingGroups:
          type: "array"
          items:
            $ref: "#/components/schemas/OutstandingGroup"
        processing:
          type: "boolean"
        result:
          type: "object"
          additionalProperties: {}
        joinedDevice:
          type: "object"
          properties:
            connected:
              type: "boolean"
          required:
            - "connected"
      required:
        - "view"
        - "instanceId"
        - "journey"
    OutstandingGroup:
      type: "object"
      properties:
        elementId:
          type: "string"
        cardinality:
          type: "string"
          example: "at-least-one"
          description: "How many of `refs` are needed. Only 'at-least-one' today; more values may be added."
        refs:
          type: "array"
          items:
            type: "string"
      required:
        - "elementId"
        - "cardinality"
        - "refs"
    SlimInteractionFetchResponse:
      type: "object"
      properties:
        view:
          type: "string"
          enum:
            - "slim"
        instanceId:
          type: "string"
        interactionId:
          type: "string"
        journey:
          type: "object"
          properties:
            status:
              type: "string"
              enum:
                - "InProgress"
                - "Completed"
                - "Failed"
                - "Paused"
          required:
            - "status"
        interaction:
          type: "object"
          additionalProperties: {}
        processing:
          type: "boolean"
        outstanding:
          type: "array"
          items:
            type: "string"
        outstandingGroups:
          type: "array"
          items:
            $ref: "#/components/schemas/OutstandingGroup"
        instructions:
          type: "array"
          items:
            type: "string"
        result:
          $ref: "#/components/schemas/SlimResult"
        joinedDevice:
          type: "object"
          properties:
            connected:
              type: "boolean"
          required:
            - "connected"
      required:
        - "view"
        - "instanceId"
        - "journey"
    SlimResult:
      type: "object"
      properties:
        outcome:
          type: "string"
        status:
          type: "string"
          enum:
            - "pending"
            - "complete"
            - "error"
            - "timeout"
          description: "Headline result state, and the AUTHORITATIVE signal for whether the journey succeeded. `complete` means the journey finished. A `complete` journey may still list `errors`: a module step failed (e.g. a data source was unavailable) and the journey continued past it, as configured (on a state fetch each failed step is also marked on `steps[]`). `error` means it ended in failure — for example a module reported a terminal error (journeys run without per-step module error handling, which includes every journey on engine 2), a module that could not be found or routed at all, a step whose output broke its declared contract, or the platform abandoning the journey before it could finish (a deadlock, an interaction or execution timeout, or a spin). Abandonment is reported as `error` rather than as a distinct value. `pending` is reported for a running journey once its state has materialized. `timeout` is part of this range but is not currently emitted at journey level — an elapsed deadline surfaces as `error`. When `status` disagrees with `outcome` or `outcomeClassification`, `status` wins: a journey can pass an evaluation and then fail before finishing, leaving a positive classification beside `status: \"error\"`. Both are true — the evaluation did pass — but the journey did not complete, so do not read a positive classification as success. Note also that an `error` caused by abandonment is generally NOT retryable — a deadlocked journey deadlocks again — even though the accompanying error advises a retry; start a new journey instead."
        outcomeClassification:
          type:
            - "string"
            - "null"
          enum:
            - "positive"
            - "negative"
            - "neutral"
            - null
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/SlimModuleStepError"
          minItems: 1
          description: "Customer-safe errors. Failed module steps are listed as they happen, so `errors` can appear while the journey is still `pending`. For an `error`/`timeout` journey the first entry describes the journey failure. One further entry is listed per failed module step (codes 5021 step failed, 5022 step timed out, 5023 step could not be started), on a `complete` journey too, in step order. On a state fetch the failed steps carry the same entry on `steps[].error`."
        data:
          $ref: "#/components/schemas/SlimVerifiedData"
    SlimModuleStepError:
      allOf:
        - $ref: "#/components/schemas/GbgError"
        - type: "object"
          properties:
            cause:
              type: "object"
              properties:
                code:
                  type: "string"
                  description: "The module's own error code, as emitted (e.g. `5012`, `BD10003`). Present only when the module emitted a structured code; look it up in the module or GBG Errors Catalog documentation."
                correlationId:
                  type: "string"
                  description: "The upstream service's trace id for the failed request (e.g. SIP's `gbg-correlation-id`), taken from the same error as `code`."
                moduleId:
                  type: "string"
                  description: "The module the failed step ran. On an interaction fetch, which carries no step history, `cause` has only `moduleId`/`variantId`; the module code and correlation id are on the state fetch."
                variantId:
                  type: "string"
                  description: "The module variant (configuration) the step ran."
    SlimVerifiedData:
      type: "object"
      properties:
        identity:
          $ref: "#/components/schemas/SlimIdentity"
        documents:
          type: "array"
          items:
            $ref: "#/components/schemas/SlimDocument"
      description: "Verified-output slice (OQ-A). May be transiently ABSENT on a journey already reporting `status: complete`: the certified view materializes just after the completion signal, so a client reading `data` the instant it sees `complete` may need to re-poll once. Absent `data` means \"not yet available\", not \"no verified data\". (Read-after-write closure tracked in GGO-16738.)"
    SlimIdentity:
      type: "object"
      properties:
        title:
          type: "string"
          minLength: 1
          description: "Title of an individual such as Mr, Mrs, Dr, Sir"
        firstName:
          type: "string"
          minLength: 1
          description: "A person's name used by their collegues and friends to address them"
        middleNames:
          type: "array"
          items:
            type: "string"
            minLength: 1
          description: "Any other registered names used by the individual, not aliases"
        lastNames:
          type: "array"
          items:
            type: "string"
            minLength: 1
          minItems: 1
          description: "Any family names for the individual"
        lastNamesAtBirth:
          type: "array"
          items:
            type: "string"
            minLength: 1
          minItems: 1
          description: "Any family names for the individual"
        dateOfBirth:
          type: "string"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Specified in year, month and day separated by -.  For example 2017-1-1 or 2017-01-01 which conforms to ISO 8601"
        gender:
          type: "string"
          minLength: 1
        currentAddress:
          type: "object"
          properties:
            lines:
              type: "array"
              items:
                type: "string"
              description: "Unformatted line based address"
            addressString:
              type: "string"
              description: "The address as a single line"
            premise:
              type: "string"
              description: "The number identifying the property's delivery point on its street — \"128\", \"30A\", \"8-12\". Not the street name (thoroughfare), the unit (subBuilding), or a building or property name (building). Empty for a property identified only by a name."
            building:
              type: "string"
              description: "The name of the building, complex, or named property — \"Landmark House\", \"The Shard\". Never the street number, in any country; that is premise. A property identified only by a name populates this field with premise left empty."
            subBuilding:
              type: "string"
              description: "The unit within the property, such as a flat, apartment or suite number — \"FLAT 1\", \"SUITE 212\"."
            thoroughfare:
              type: "string"
              description: "This field holds the most common street or block data element within a country. For instance, USA Street"
            dependentThoroughfare:
              type: "string"
              description: "The name of a dependent street or block, such as a street within a complex."
            locality:
              type: "string"
              description: "This field holds the most common population center data element within a country. For instance, USA City, Canadian Municipality"
            dependentLocality:
              type: "string"
              description: "This is a smaller area within a locality, such as a neighborhood or district. Like Manhattan in New York City, or Soho in London."
            doubleDependentLocality:
              type: "string"
              description: "This is an even smaller area within a dependent locality, often used in very detailed addresses."
            postalCode:
              type: "string"
              description: "This field contains the complete postal code for a particular delivery point, should such detail be able to be determined. For example ZIP code in the US"
            postBox:
              type: "string"
              description: "This field contains the post box number associated with a particular delivery point, should one exist."
            country:
              type: "string"
              pattern: "^[A-Z]{2,3}$"
              description: "Country the address is in. It must be a valid ISO2 or ISO3 country code"
            superAdministrativeArea:
              type: "string"
            administrativeArea:
              type: "string"
            subAdministrativeArea:
              type: "string"
            organization:
              type: "string"
            location:
              type: "object"
              properties:
                latitude:
                  type: "string"
                longitude:
                  type: "string"
                geoAccuracy:
                  type: "string"
                what3words:
                  type: "string"
                  description: "A What3words designation associated with this location with '.' separator."
        placeOfBirth:
          type: "object"
          properties:
            lines:
              type: "array"
              items:
                type: "string"
              description: "Unformatted line based address"
            addressString:
              type: "string"
              description: "The address as a single line"
            premise:
              type: "string"
              description: "The number identifying the property's delivery point on its street — \"128\", \"30A\", \"8-12\". Not the street name (thoroughfare), the unit (subBuilding), or a building or property name (building). Empty for a property identified only by a name."
            building:
              type: "string"
              description: "The name of the building, complex, or named property — \"Landmark House\", \"The Shard\". Never the street number, in any country; that is premise. A property identified only by a name populates this field with premise left empty."
            subBuilding:
              type: "string"
              description: "The unit within the property, such as a flat, apartment or suite number — \"FLAT 1\", \"SUITE 212\"."
            thoroughfare:
              type: "string"
              description: "This field holds the most common street or block data element within a country. For instance, USA Street"
            dependentThoroughfare:
              type: "string"
              description: "The name of a dependent street or block, such as a street within a complex."
            locality:
              type: "string"
              description: "This field holds the most common population center data element within a country. For instance, USA City, Canadian Municipality"
            dependentLocality:
              type: "string"
              description: "This is a smaller area within a locality, such as a neighborhood or district. Like Manhattan in New York City, or Soho in London."
            doubleDependentLocality:
              type: "string"
              description: "This is an even smaller area within a dependent locality, often used in very detailed addresses."
            postalCode:
              type: "string"
              description: "This field contains the complete postal code for a particular delivery point, should such detail be able to be determined. For example ZIP code in the US"
            postBox:
              type: "string"
              description: "This field contains the post box number associated with a particular delivery point, should one exist."
            country:
              type: "string"
              pattern: "^[A-Z]{2,3}$"
              description: "Country the address is in. It must be a valid ISO2 or ISO3 country code"
            superAdministrativeArea:
              type: "string"
            administrativeArea:
              type: "string"
            subAdministrativeArea:
              type: "string"
            organization:
              type: "string"
            location:
              type: "object"
              properties:
                latitude:
                  type: "string"
                longitude:
                  type: "string"
                geoAccuracy:
                  type: "string"
                what3words:
                  type: "string"
                  description: "A What3words designation associated with this location with '.' separator."
        idNumbers:
          type: "array"
          items:
            type: "object"
            properties:
              type:
                type: "string"
                description: "The type of phone number, such as landline, mobile, fax, unknown etc"
              idNumber:
                type: "string"
                minLength: 1
                description: "ID number eg, National Insurance Number in UK, Social Securtiy Number in US"
              country:
                type: "string"
                pattern: "^[A-Z]{2,3}$"
                description: "Country the address is in. It must be a valid ISO2 or ISO3 country code"
            required:
              - "type"
              - "idNumber"
    SlimDocument:
      type: "object"
      properties:
        type:
          type: "string"
        category:
          type: "string"
        subType:
          type: "string"
        format:
          type: "string"
        number:
          type: "string"
          minLength: 1
        issueDate:
          type: "string"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Specified in year, month and day separated by -.  For example 2017-1-1 or 2017-01-01 which conforms to ISO 8601"
        expiryDate:
          type: "string"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Specified in year, month and day separated by -.  For example 2017-1-1 or 2017-01-01 which conforms to ISO 8601"
        country:
          type: "string"
          pattern: "^[A-Z]{2,3}$"
          description: "Country the address is in. It must be a valid ISO2 or ISO3 country code"
        classification:
          type: "object"
          properties:
            ids:
              type: "array"
              items:
                type: "string"
            category:
              type: "string"
            type:
              type: "string"
            subtype:
              type: "string"
            isDoubleSided:
              type: "boolean"
            hasNFC:
              type: "boolean"
            year:
              type: "string"
            countryCode:
              type: "string"
            countryName:
              type: "string"
            stateCode:
              type: "string"
            stateName:
              type: "string"
            sides:
              type: "array"
              items:
                type: "object"
                properties:
                  side:
                    type: "string"
                  id:
                    type: "string"
                  documentQuality:
                    type: "string"
                  documentQualityScore:
                    type: "number"
                required:
                  - "side"
                  - "id"
                  - "documentQuality"
                  - "documentQualityScore"
        extraction:
          $ref: "#/components/schemas/SlimExtraction"
        validation:
          $ref: "#/components/schemas/SlimValidation"
    SlimExtraction:
      type: "object"
      properties:
        aggregatedFields:
          type: "array"
          items:
            type: "object"
            properties:
              label:
                type: "string"
              value:
                type: "string"
              source:
                type: "string"
              isNonLatin:
                type: "boolean"
              regionOfInterest:
                type: "object"
                properties:
                  boundingBox:
                    type: "object"
                    properties:
                      x:
                        type: "number"
                      y:
                        type: "number"
                      width:
                        type: "number"
                      height:
                        type: "number"
                    required:
                      - "x"
                      - "y"
                      - "width"
                      - "height"
                  side:
                    type: "string"
                  spectrum:
                    type: "string"
                  imageId:
                    type: "string"
                required:
                  - "side"
            required:
              - "label"
              - "value"
              - "source"
              - "isNonLatin"
        extractedFields:
          type: "array"
          items:
            type: "object"
            properties:
              label:
                type: "string"
              details:
                type: "array"
                items:
                  type: "object"
                  properties:
                    label:
                      type: "string"
                    value:
                      type: "string"
                    source:
                      type: "string"
                    isNonLatin:
                      type: "boolean"
                    regionOfInterest:
                      type: "object"
                      properties:
                        boundingBox:
                          type: "object"
                          properties:
                            x:
                              type: "number"
                            y:
                              type: "number"
                            width:
                              type: "number"
                            height:
                              type: "number"
                          required:
                            - "x"
                            - "y"
                            - "width"
                            - "height"
                        side:
                          type: "string"
                        spectrum:
                          type: "string"
                        imageId:
                          type: "string"
                      required:
                        - "side"
                  required:
                    - "label"
                    - "value"
                    - "source"
                    - "isNonLatin"
            required:
              - "label"
              - "details"
    SlimValidation:
      type: "object"
      properties:
        validationChecks:
          type: "array"
          items:
            type: "object"
            properties:
              name:
                type: "string"
              title:
                type: "string"
              validationResult:
                type: "string"
              weight:
                type: "string"
              regionOfInterests:
                type: "array"
                items:
                  type: "object"
                  properties:
                    boundingBox:
                      type: "object"
                      properties:
                        x:
                          type: "number"
                        y:
                          type: "number"
                        width:
                          type: "number"
                        height:
                          type: "number"
                      required:
                        - "x"
                        - "y"
                        - "width"
                        - "height"
                    side:
                      type: "string"
                    spectrum:
                      type: "string"
                    imageId:
                      type: "string"
                  required:
                    - "side"
              type:
                type: "string"
            required:
              - "name"
              - "title"
              - "validationResult"
              - "weight"
              - "type"
        aggregatedValidationChecks:
          type: "array"
          items:
            type: "object"
            properties:
              name:
                type: "string"
              title:
                type: "string"
              validationResult:
                type: "string"
              weight:
                type: "string"
              regionOfInterests:
                type: "array"
                items:
                  type: "object"
                  properties:
                    boundingBox:
                      type: "object"
                      properties:
                        x:
                          type: "number"
                        y:
                          type: "number"
                        width:
                          type: "number"
                        height:
                          type: "number"
                      required:
                        - "x"
                        - "y"
                        - "width"
                        - "height"
                    side:
                      type: "string"
                    spectrum:
                      type: "string"
                    imageId:
                      type: "string"
                  required:
                    - "side"
              type:
                type: "string"
            required:
              - "name"
              - "title"
              - "validationResult"
              - "weight"
              - "type"
    InteractionSubmitResponse:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "success"
      required:
        - "status"
    HandoffTokenResponse:
      type: "object"
      properties:
        instanceUrl:
          type: "string"
        devicePosition:
          type: "string"
          enum:
            - "origin"
            - "joined"
        expiresIn:
          type: "number"
      required:
        - "instanceUrl"
        - "devicePosition"
        - "expiresIn"
    LoqateSearchResponse:
      type: "object"
      properties:
        Items:
          type: "array"
          items:
            type: "object"
            additionalProperties: {}
      required:
        - "Items"
    LoqateRetrieveResponse:
      type: "object"
      properties:
        Items:
          type: "array"
          items:
            type: "object"
            additionalProperties: {}
      required:
        - "Items"
    SlimStateFetchResponse:
      type: "object"
      properties:
        view:
          type: "string"
          enum:
            - "slim"
        instanceId:
          type: "string"
        status:
          type: "string"
          enum:
            - "InProgress"
            - "Completed"
            - "Error"
        journey:
          $ref: "#/components/schemas/SlimJourney"
        steps:
          type: "array"
          items:
            $ref: "#/components/schemas/SlimStep"
        result:
          $ref: "#/components/schemas/SlimResult"
      required:
        - "view"
        - "instanceId"
        - "status"
    SlimJourney:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        version:
          type: "string"
        startedAt:
          type: "string"
        endedAt:
          type: "string"
    SlimStep:
      type: "object"
      properties:
        nodeId:
          type: "string"
        name:
          type: "string"
        outcome:
          type: "string"
        outcomeClassification:
