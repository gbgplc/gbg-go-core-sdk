workflow:
    workflowVersion: 1.0.0
    speakeasyVersion: latest
    sources:
        GBG GO Next Gen Flow Captain API:
            inputs:
                - location: https://eu.platform.go.gbgplc.com/v2/captain/openapi.json
            overlays:
                - location: .speakeasy/speakeasy-modifications-overlay.yaml
            output: .speakeasy/out.openapi.yaml
            registry:
                location: registry.speakeasyapi.dev/gbg/go/gbg-go-next-gen-flow-captain-api
    targets:
        go:
            target: typescript
            source: GBG GO Next Gen Flow Captain API
            publish:
                npm:
                    token: $npm_token
            codeSamples:
                registry:
                    location: registry.speakeasyapi.dev/gbg/go/gbg-go-next-gen-flow-captain-api-typescript-code-samples
                labelOverride:
                    fixedValue: Typescript (SDK)
                blocking: false
        java:
            target: java
            source: GBG GO Next Gen Flow Captain API
            output: ./java
            publish:
                java:
                    ossrhUsername: $ossrh_username
                    ossrhPassword: $ossrh_password
                    gpgSecretKey: $java_gpg_secret_key
                    gpgPassPhrase: $java_gpg_passphrase
            codeSamples:
                registry:
                    location: registry.speakeasyapi.dev/gbg/go/gbg-go-next-gen-flow-captain-api-java-code-samples
                labelOverride:
                    fixedValue: Java (SDK)
                blocking: false
