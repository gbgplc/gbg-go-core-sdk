name: Generate
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: optionally set a specific SDK version
        type: string
  schedule:
    - cron: 0 0 * * *
    - cron: 0 6 * * 1
  pull_request:
    types:
      - labeled
      - unlabeled
jobs:
  generate:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@v15.60.7
    with:
      force: ${{ github.event.inputs.force == 'true' || github.event.schedule == '0 6 * * 1' }}
      mode: pr
      set_version: ${{ github.event.inputs.set_version }}
    secrets:
      # A pull request opened with the default GITHUB_TOKEN does not start new
      # workflow runs — GitHub blocks that to stop workflows triggering
      # themselves. The side effect is that the generated SDK pull requests,
      # the ones most worth testing, get no checks at all.
      #
      # SDK_BOT_TOKEN is a GitHub App installation token with write access to
      # this repository and read access to gbgplc/gbg-go-core-sdk-test. With it
      # set, Contract tests runs on generation pull requests like any other.
      # The fallback keeps generation working if the secret is absent, at the
      # cost of those pull requests going unchecked again.
      github_access_token: ${{ secrets.SDK_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      npm_token: ${{ secrets.NPM_TOKEN }}
      ossrh_username: ${{ secrets.OSSRH_USERNAME }}
      ossrh_password: ${{ secrets.OSSRH_PASSWORD }}
      java_gpg_secret_key: ${{ secrets.JAVA_GPG_SECRET_KEY }}
      java_gpg_passphrase: ${{ secrets.JAVA_GPG_PASSPHRASE }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
