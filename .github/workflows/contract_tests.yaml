# Run the SDK test suite against the build in a pull request.
#
# The SDKs here are generated, not hand-written, so a regeneration can rename a
# field, move an endpoint or shift where a credential is placed without anyone
# reading the diff closely enough to notice. gbgplc/gbg-go-core-sdk-test exists
# to catch exactly that, and this workflow points it at the pull request's own
# build rather than the last published one.
#
# Only the contract tier runs: it needs no credentials and no network. The live
# tier makes real calls against the demo environment and stays out.
#
# Two triggers, because generated pull requests cannot use the ordinary one. A
# pull request opened with the default GITHUB_TOKEN does not start new workflow
# runs — GitHub blocks that so workflows cannot trigger themselves — and the
# generator has no other token. So those are picked up by watching Generate
# finish instead, and the result is posted back as a commit status.
name: Contract tests

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch: {}
  workflow_run:
    workflows: [Generate]
    types: [completed]

concurrency:
  group: >-
    contract-tests-${{ github.event.pull_request.number
      || github.event.workflow_run.id
      || github.ref }}
  cancel-in-progress: true

jobs:
  target:
    name: Resolve what to test
    runs-on: ubuntu-latest
    # A failed generation has nothing worth testing.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      found: ${{ steps.resolve.outputs.found }}
      sha: ${{ steps.resolve.outputs.sha }}
      report: ${{ steps.resolve.outputs.report }}
    steps:
      - name: Resolve the commit under test
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              # GitHub already shows these as checks on the pull request, so
              # there is nothing to post.
              {
                echo "found=true"
                echo "sha=$PR_SHA"
                echo "report=false"
              } >> "$GITHUB_OUTPUT"
              echo "Testing pull request head $PR_SHA"
              ;;
            workflow_run)
              # The generator opens its pull request partway through the
              # Generate run, so that run's own head_branch is main rather than
              # the generated branch. Find the branch instead.
              pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                     --json number,headRefName,headRefOid \
                     --jq '[.[] | select(.headRefName | startswith("speakeasy-sdk-regen-"))]
                           | sort_by(.number) | last // empty')
              if [ -z "$pr" ]; then
                echo "Generate opened no pull request, so there is nothing to test."
                echo "found=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              number=$(echo "$pr" | jq -r .number)
              sha=$(echo "$pr" | jq -r .headRefOid)
              {
                echo "found=true"
                echo "sha=$sha"
                echo "report=true"
              } >> "$GITHUB_OUTPUT"
              echo "Testing generated pull request #$number at $sha"
              ;;
            *)
              {
                echo "found=true"
                echo "sha=$GITHUB_SHA"
                echo "report=false"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

  typescript:
    name: TypeScript
    needs: target
    if: needs.target.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the SDK under test
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          path: sdk

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The suite installs the SDK as a directory dependency, which npm links
      # rather than packs. A link exposes the working tree as it stands, so
      # dist/ has to exist before the link is made — npm runs `prepare` on a
      # file: install, and this package builds under `prepublishOnly`, which it
      # does not.
      - name: Build the SDK from this pull request
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Check out the test suite
        uses: actions/checkout@v7
        with:
          repository: gbgplc/gbg-go-core-sdk-test
          path: suite
          ssh-key: ${{ secrets.SDK_TEST_REPO_KEY }}

      - name: Point the suite at this build
        working-directory: suite
        run: |
          npm ci
          npm pkg set dependencies.@gbg/go-core=file:../sdk
          npm install

      # GO_SDK_LOCAL is the suite's opt-in for testing an unpublished build.
      # provenance.test.ts asserts in both directions: without it a linked SDK
      # fails the run, and with it an SDK that is *not* linked fails too. So a
      # green run here is evidence the pull request's own build was tested.
      - name: Contract tier
        working-directory: suite
        env:
          GO_SDK_LOCAL: "1"
        run: npm run test:contract

  java:
    name: Java
    needs: target
    if: needs.target.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the SDK under test
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          path: sdk

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      # The suite defaults to the last published version, so publishing this
      # build to ~/.m2 is not enough on its own: without -PsdkVersion a
      # regeneration that bumps the number would resolve the published artifact
      # and report a pass for code this pull request does not contain.
      - name: Read the version this pull request builds
        id: sdk
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' sdk/java/gradle.properties)
          if [ -z "$version" ]; then
            echo "::error::no version= line in java/gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SDK version under test: $version"

      # -Pskip.signing: a local publish has no reason to want the GPG release key.
      - name: Publish it to the local Maven repository
        working-directory: sdk/java
        run: ./gradlew publishToMavenLocal -Pskip.signing

      - name: Check out the test suite
        uses: actions/checkout@v7
        with:
          repository: gbgplc/gbg-go-core-sdk-test
          path: suite
          ssh-key: ${{ secrets.SDK_TEST_REPO_KEY }}

      # -PuseLocalSdk is what puts mavenLocal() on the repository list at all.
      # ProvenanceTest fails the run if the resolved jar did not come from
      # ~/.m2 after opting in, so this cannot quietly test the published alpha.
      - name: Report the SDK under test
        working-directory: suite/java
        run: >-
          ./gradlew printResolvedSdk
          -PuseLocalSdk
          -PsdkVersion=${{ steps.sdk.outputs.version }}

      - name: Contract tier
        working-directory: suite/java
        run: >-
          ./gradlew test --tests 'com.gbg.gocore.test.contract.*'
          -PuseLocalSdk
          -PsdkVersion=${{ steps.sdk.outputs.version }}

  status:
    name: Report to the generated pull request
    needs: [target, typescript, java]
    if: always() && needs.target.outputs.report == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      # Generated pull requests get no checks of their own, so without this the
      # result would sit in a workflow run nobody is looking at.
      - name: Post the result as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.target.outputs.sha }}
          TS_RESULT: ${{ needs.typescript.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          post() {
            if [ "$1" = "success" ]; then
              state=success
              description="contract tier passed"
            else
              state=failure
              description="contract tier $1"
            fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -X POST \
              -f state="$state" \
              -f context="$2" \
              -f description="$description" \
              -f target_url="$RUN_URL" > /dev/null
            echo "$2: $state"
          }
          post "$TS_RESULT" "Contract tests / TypeScript"
          post "$JAVA_RESULT" "Contract tests / Java"
